<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3e9d8" />
    <title>graao</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Boot shell: inline so the logo and real progress paint before any script arrives. */
      html, body { margin: 0; height: 100%; background: #f3e9d8; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: #f3e9d8;
        font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; color: #2a2130; }
      #boot .stack { display: grid; justify-items: center; gap: 22px; }
      #boot .logo { width: min(340px, 70vw); }
      #boot .bar { width: min(280px, 60vw); height: 6px; border-radius: 6px; background: #e3d5bf; overflow: hidden; }
      #boot .bar > i { display: block; height: 100%; width: 0%; background: #2a2130; border-radius: 6px; transition: width .25s ease; }
      #boot .status { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; min-height: 1.2em; }
      #boot button { font: inherit; font-weight: 800; font-size: 18px; letter-spacing: .12em; padding: 14px 34px; border: 3px solid #2a2130;
        border-radius: 999px; background: #ffd36e; color: #2a2130; cursor: pointer; box-shadow: 0 5px 0 #2a2130; transform: translateY(-2px); }
      #boot button:hover { background: #ffdf8f; }
      #boot button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a2130; }
      #boot button[hidden] { display: none; }
      #boot .err { color: #b3261e; max-width: 70vw; text-align: center; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="stack">
        <svg class="logo" viewBox="0 0 340 120" role="img" aria-label="graao">
          <path d="M28 70c-8-30 30-52 70-46 26 4 40-12 74-10 44 2 84 14 120 30 22 10 26 34 6 48-30 20-80 22-130 18-48-4-128 6-140-40z" fill="#ffd36e" opacity=".9"/>
          <path d="M60 40c30-16 80-8 110-14" stroke="#ec8a3a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
          <text x="170" y="86" text-anchor="middle" font-family="ui-rounded, 'SF Pro Rounded', Nunito, 'Segoe UI', system-ui, sans-serif"
            font-size="78" font-weight="900" fill="#2a2130" letter-spacing="2">graao</text>
          <circle cx="282" cy="30" r="9" fill="#4f86c9"/><circle cx="282" cy="30" r="9" fill="none" stroke="#2a2130" stroke-width="3"/>
        </svg>
        <div class="bar"><i id="boot-bar"></i></div>
        <div class="status" id="boot-status">Abrindo o caderno de esboços…</div>
        <button id="boot-enter" hidden>ENTRAR NO GRAAO</button>
      </div>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
