# Fly.io config for the graao match server (São Paulo). See docs/infrastructure/DEPLOYMENT.md.
# `app` must be unique on Fly: change it before the first `fly launch --copy-config --no-deploy`.
app = "graao-server"
primary_region = "gru"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # Matches live in memory: never stop the machine under players, never run more than one (fly scale count 1).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
